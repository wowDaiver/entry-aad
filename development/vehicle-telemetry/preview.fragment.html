<div id="entrynav2-telemetry-preview">
  <style>
    #entrynav2-telemetry-preview .vt-scenario {display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    #entrynav2-telemetry-preview .vt-screen {background:#17202b;color:#eef1f4;border-radius:6px;overflow:hidden;font-family:Arial,sans-serif}
    #entrynav2-telemetry-preview .vt-header {display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;background:#232f3e;flex-wrap:wrap}
    #entrynav2-telemetry-preview .vt-header strong {font-weight:500;font-size:20px}
    #entrynav2-telemetry-preview .vt-demo {font-size:11px;color:#f1c781;letter-spacing:.07em}
    #entrynav2-telemetry-preview .vt-main {padding:14px 20px}
    #entrynav2-telemetry-preview .vt-gauges {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    #entrynav2-telemetry-preview .vt-gauge {position:relative;text-align:center;min-width:0}
    #entrynav2-telemetry-preview .vt-gauge svg {width:100%;height:130px;display:block;fill:none}
    #entrynav2-telemetry-preview .vt-gauge .vt-value {position:absolute;top:46px;width:100%;font-size:32px;font-weight:500}
    #entrynav2-telemetry-preview .vt-gauge .vt-unit {font-size:14px}
    #entrynav2-telemetry-preview .vt-gauge .vt-label {margin-top:-16px;font-size:14px}
    #entrynav2-telemetry-preview .vt-status {min-height:16px;font-size:11px;color:#acb8c6;margin-top:4px}
    #entrynav2-telemetry-preview .vt-small-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px;margin-top:17px}
    #entrynav2-telemetry-preview .vt-small {min-width:0;padding:6px 0}
    #entrynav2-telemetry-preview .vt-line {display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
    #entrynav2-telemetry-preview .vt-line output {font-size:17px;font-variant-numeric:tabular-nums}
    #entrynav2-telemetry-preview .vt-track {height:4px;background:#354252;margin-top:7px;border-radius:2px}
    #entrynav2-telemetry-preview .vt-fill {height:100%;background:#41a8db;border-radius:2px;transition:width .2s ease}
    #entrynav2-telemetry-preview .vt-bottom {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding-top:16px;margin-top:12px;border-top:1px solid #354252}
    #entrynav2-telemetry-preview .vt-bottom .vt-line {display:block}
    #entrynav2-telemetry-preview .vt-bottom output {display:block;margin-top:5px}
    #entrynav2-telemetry-preview .vt-battery {display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;margin-top:17px;font-size:14px}
    #entrynav2-telemetry-preview .vt-battery output {font-size:20px;font-variant-numeric:tabular-nums}
    #entrynav2-telemetry-preview .vt-footer {color:#acb8c6;font-size:11px;margin-top:12px}
    #entrynav2-telemetry-preview [data-state="stale"] output,#entrynav2-telemetry-preview [data-state="stale"] .vt-value {color:#bec7d2}
    #entrynav2-telemetry-preview [data-state="stale"] .vt-fill {opacity:.4}
    @media(max-width:560px) {
      #entrynav2-telemetry-preview .vt-header {padding:12px}
      #entrynav2-telemetry-preview .vt-header strong {font-size:17px}
      #entrynav2-telemetry-preview .vt-main {padding:12px}
      #entrynav2-telemetry-preview .vt-small-grid {grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
      #entrynav2-telemetry-preview .vt-bottom {grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
      #entrynav2-telemetry-preview .vt-gauges {gap:4px}
      #entrynav2-telemetry-preview .vt-gauge svg {height:110px}
      #entrynav2-telemetry-preview .vt-gauge .vt-value {top:43px;font-size:24px}
      #entrynav2-telemetry-preview .vt-gauge .vt-label {margin-top:-4px;font-size:12px}
      #entrynav2-telemetry-preview .vt-gauge .vt-unit {font-size:12px}
    }
    @media(prefers-reduced-motion:reduce) {#entrynav2-telemetry-preview .vt-fill {transition:none}}
  </style>
  <div class="vt-scenario">
    <label class="form-label" for="vt-scenario">Сценарий ответа</label>
    <select class="form-select" id="vt-scenario">
      <option value="values">Тестовые значения</option>
      <option value="waiting">Получение данных</option>
      <option value="stale">Связь потеряна · последние данные</option>
      <option value="error">Источник недоступен</option>
    </select>
  </div>
  <section class="vt-screen" aria-label="Прототип панели EntryNav2" aria-live="polite">
    <div class="vt-header"><strong>Параметры автомобиля</strong><span class="vt-demo">ОФЛАЙН · СИНТЕТИЧЕСКИЕ ДАННЫЕ</span></div>
    <div class="vt-main">
      <div class="vt-gauges" id="vt-gauges"></div>
      <div class="vt-small-grid" id="vt-small-grid"></div>
      <div class="vt-bottom" id="vt-bottom"></div>
      <div class="vt-battery" id="vt-battery"></div>
      <div class="vt-footer">* Температура ДВС и SoC АКБ 12 В ещё требуют проверки на автомобиле. Шкалы условные.</div>
    </div>
  </section>
  <script id="vt-native-scenarios" type="application/json">__NATIVE_SCENARIOS__</script>
  <script>
    (() => {
      const root = document.getElementById('entrynav2-telemetry-preview');
      const scenarios = JSON.parse(root.querySelector('#vt-native-scenarios').textContent);
      const picker = root.querySelector('#vt-scenario');
      const states = {valid:'',loading:'Получение данных',stale:'Последние данные',unavailable:'Нет данных'};
      const gauges = [['engine_temperature','Температура ДВС*','°C',150],['oil_temperature','Масло','°C',150],['boost','Наддув','bar',2.5]];
      const small = [['intake_temperature','Темп. впуска','°C',80],['voltage','Напряжение','В',16],['rail_pressure','Давл. в рейке','bar',300],['exhaust_temperature','Темп. выхлопа','°C',900],['fuel_pressure','Давл. топлива','bar',10],['engine_load','Нагрузка ДВС','%',100]];
      const bottom = [['rpm','Обороты','об/мин'],['speed','Скорость','км/ч'],['gearbox_temperature','Темп. АКПП','°C'],['average_consumption','Расход (ср.)','л/100 км']];
      const saved = window.openai?.widgetState?.privateContent?.scenario;
      if (saved && scenarios[saved]) picker.value = saved;
      const valueText = (r) => r.value === null ? '—' : Number(r.value).toLocaleString('ru-RU',{maximumFractionDigits:1});
      function render() {
        const rows = scenarios[picker.value].readings;
        root.querySelector('#vt-gauges').innerHTML = gauges.map(([key,label,unit,max]) => {
          const r = rows[key], fraction = r.value === null ? 0 : Math.max(0,Math.min(1,r.value/max));
          return `<div class="vt-gauge" data-state="${r.state}"><svg viewBox="0 0 180 140" role="img" aria-label="${label}: ${valueText(r)} ${r.value===null?'':unit}"><path d="M 34 116 A 68 68 0 1 1 146 116" stroke="#8d9cab" stroke-width="10" opacity=".3"/><path d="M 34 116 A 68 68 0 1 1 146 116" stroke="#9ac5dd" stroke-width="10" pathLength="100" stroke-dasharray="${fraction*100} 100"/></svg><div class="vt-value">${valueText(r)} <span class="vt-unit">${r.value===null?'':unit}</span></div><div class="vt-label">${label}</div><div class="vt-status">${states[r.state]}</div></div>`;
        }).join('');
        function metric([key,label,unit,max],track) {
          const r = rows[key];
          return `<div class="vt-small" data-state="${r.state}"><div class="vt-line"><span>${label}</span><output>${valueText(r)} ${r.value===null?'':unit}</output></div>${track?`<div class="vt-track"><div class="vt-fill" style="width:${r.value===null?0:Math.max(0,Math.min(100,r.value/max*100))}%"></div></div>`:''}<div class="vt-status">${states[r.state]}</div></div>`;
        }
        root.querySelector('#vt-small-grid').innerHTML = small.map(x=>metric(x,true)).join('');
        root.querySelector('#vt-bottom').innerHTML = bottom.map(x=>metric(x,false)).join('');
        const r = rows.battery_soc;
        root.querySelector('#vt-battery').dataset.state = r.state;
        root.querySelector('#vt-battery').innerHTML = `<span>Аккумулятор 12 В*</span><output>${valueText(r)} ${r.value===null?'':'%'}</output><span class="vt-status">${states[r.state]}</span>`;
      }
      picker.addEventListener('change',() => {
        render();
        window.openai?.setWidgetState({modelContent:{scenario:picker.value,source:'synthetic-native-replay'},privateContent:{scenario:picker.value}}).catch(()=>{});
      });
      window.addEventListener('openai:set_globals',event => {
        const scenario = event.detail?.globals?.widgetState?.privateContent?.scenario;
        if(scenario && scenarios[scenario]) {picker.value=scenario;render();}
      });
      render();
    })();
  </script>
</div>
