name: Bug report
description: Something does not work as described (reports in French are welcome too).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please never paste your car's VIN, a password, or GPS positions.
  - type: input
    id: version
    attributes:
      label: entry-aad version
      description: The release you installed, or the commit you built.
      placeholder: 0.12.0-rc.2
    validations:
      required: true
  - type: input
    id: car
    attributes:
      label: Car and iDrive software
      description: Model and year, and the first line of /etc/version on the head unit.
      placeholder: G20 320d 2020, 202111011321
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone, Android and Android Auto versions
      placeholder: Pixel 8, Android 15, Android Auto 14.2
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce, from starting the car.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        With logs switched on (docs/MAINTENANCE.md): /var/local/data/AA/app.log and /tmp/entry-aa-service.log.
        Drag the files here.
